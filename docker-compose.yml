services:
  postgres_db:
    image: postgres:16-alpine
    container_name: appointment_db
    environment:
      POSTGRES_DB: appointment_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: SecretPassword123!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d appointment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend_api:
    build:
      context: ./AppointmentApi
      dockerfile: Dockerfile
    container_name: appointment_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres_db;Database=appointment_db;Username=admin;Password=SecretPassword123!
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - GoogleCalendarSettings__ClientId=${GOOGLE_CALENDAR_CLIENT_ID}
      - GoogleCalendarSettings__ClientSecret=${GOOGLE_CALENDAR_CLIENT_SECRET}
      - GoogleCalendarSettings__RefreshToken=${GOOGLE_CALENDAR_REFRESH_TOKEN}
      - GoogleCalendarSettings__CalendarId=${GOOGLE_CALENDAR_ID:-primary}
    ports:
      - "8081:8080"
    depends_on:
      postgres_db:
        condition: service_healthy

